[package]
name = "cpan-distribution-build"
version = "0.2.2"
edition = "2024"
description = "Build and install a CPAN distribution programatically."
repository = "https://github.com/uperl/cpan-distribution-build"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
cpan-distribution-meta = { git = "https://github.com/uperl/rust-cpan-distribution-meta.git", tag = "v0.1.1", version = "0.1.1" }
perl-wrapper = { git = "https://github.com/uperl/rust-perl-wrapper.git", tag = "v0.2.0", version = "0.2.0" }

[dev-dependencies]
tempfile = "3"
which = "8"


